<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="description" content="SAINTYVES — premium instrumentals for artists who refuse to sound ordinary." />
  <title>SAINTYVES — Your Sound. Your World.</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="noise"></div>
  <header class="site-header">
    <a class="wordmark" href="#home" data-route="home">SAINTYVES<span>®</span></a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="#beats" data-route="beats">Beats</a>
      <a href="#about" data-route="about">About</a>
      <a href="#contact" data-route="contact">Contact</a>
    </nav>
    <div class="header-tools">
      <button class="text-button" data-route="admin">Admin</button>
      <button class="cart-trigger" aria-label="Open cart"><span class="cart-icon">◌</span><b id="cart-count">0</b></button>
      <button class="menu-button" aria-label="Open menu"><i></i><i></i></button>
    </div>
  </header>

  <main id="app"></main>

  <div class="player" id="player" aria-label="Music player">
    <div class="player-track"><div class="player-art" id="player-art">AH</div><div><small>NOW PLAYING</small><strong id="player-title">Select a beat</strong></div></div>
    <div class="player-controls"><button id="prev-btn" aria-label="Previous">◀</button><button class="play-main" id="play-btn" aria-label="Play">▶</button><button id="next-btn" aria-label="Next">▶</button></div>
    <div class="progress-wrap"><span id="current-time">0:00</span><input id="progress" type="range" min="0" max="100" value="0" aria-label="Track progress"><span id="duration">2:43</span></div>
    <button class="volume" aria-label="Volume">◖</button>
  </div>

  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
    <div class="drawer-head"><div><small>YOUR SELECTION</small><h2>Cart <span id="drawer-count">(0)</span></h2></div><button class="close-drawer" aria-label="Close cart">×</button></div>
    <div class="cart-items" id="cart-items"><div class="empty-cart">Your vault is empty.<br><a href="#beats" data-route="beats">Explore the latest drops →</a></div></div>
    <div class="cart-footer"><div><span>Subtotal</span><strong id="cart-total">$0.00</strong></div><button class="button button-light checkout-btn">Continue to checkout <span>↗</span></button></div>
  </aside>
  <div class="drawer-backdrop"></div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/script.js"></script>
</body>
</html>
